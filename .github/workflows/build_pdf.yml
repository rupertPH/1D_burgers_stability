
name: Generate Burgers PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. Pobranie repozytorium
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Konfiguracja Pythona
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. Instalacja bibliotek Pythona
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Instalacja Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 5. Instalacja LaTeX (TinyTeX)
      - name: Install TinyTeX
        run: quarto install tinytex --no-prompt

      # 6. Wykonanie notebooka i wygenerowanie PDF
      - name: Render notebook to PDF
        run: quarto render burgers_report.ipynb --to pdf

      # 7. Udostępnienie PDF jako artefaktu
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: burgers-report
          path: burgers_report.pdf
          if-no-files-found: error
